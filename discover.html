<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender - Discover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/nav.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/discover.css">
</head>
<body>
  <nav id="app-nav"></nav>

  <main class="discover-page">

    <!-- Recipe of the Day -->
    <section id="recipeOfDay" class="recipe-of-day" style="display:none">
      <div id="rotdThumb" class="recipe-of-day-thumb"></div>
      <div>
        <div class="recipe-of-day-label">Recipe of the Day</div>
        <div id="rotdName" class="recipe-of-day-name"></div>
        <div id="rotdMeta" class="recipe-of-day-meta"></div>
      </div>
    </section>

    <!-- Page header -->
    <div class="discover-header">
      <h1>Discover Recipes</h1>
    </div>

    <!-- Search + filter dropdowns -->
    <div class="search-bar">
      <input
        type="search"
        id="searchInput"
        placeholder="Search by name, ingredient, or description..."
        aria-label="Search recipes"
      >
      <select id="cuisineFilter" aria-label="Filter by cuisine">
        <option value="">All Cuisines</option>
      </select>
    </div>

    <!-- Difficulty chips -->
    <div class="filter-chips-section">
      <span class="filter-chips-label">Difficulty:</span>
      <div id="difficultyChips" class="filter-chips inline-chips"></div>
    </div>

    <!-- Dietary chips -->
    <div class="filter-chips-section">
      <span class="filter-chips-label">Dietary:</span>
      <div id="dietaryChips" class="filter-chips inline-chips"></div>
    </div>

    <!-- Recipe grid -->
    <div id="discoverGrid" class="discover-grid"></div>

  </main>

  <button class="add-recipe-fab" id="addRecipeBtn">&#x2795; Add Recipe</button>

  <!-- Add to Meal Plan modal -->
  <div id="planModal" class="plan-modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="planModalTitle">
    <div class="plan-modal">
      <h3 id="planModalTitle">Add to Meal Plan</h3>
      <p id="planRecipeName" class="plan-recipe-name"></p>
      <div class="plan-modal-fields">
        <div class="plan-field">
          <label for="planDay">Day</label>
          <select id="planDay">
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
          </select>
        </div>
        <div class="plan-field">
          <label for="planMeal">Meal</label>
          <select id="planMeal">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
          </select>
        </div>
      </div>
      <div class="plan-modal-actions">
        <button id="planConfirm" class="btn-plan-confirm">Add to Plan</button>
        <button id="planCancel" class="btn-plan-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/discover.js"></script>
</body>
</html>
