<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('tender_theme'),tn=localStorage.getItem('tender_theme_name')||'default';if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark-mode');if(tn!=='default')document.documentElement.classList.add('theme-'+tn);if(tn==='code'||tn==='synthwave'||tn==='crimson')document.documentElement.classList.add('dark-mode');if(tn==='crimson')document.documentElement.dataset.crimsonFont=localStorage.getItem('tender_crimson_font')||'space';})()</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo.png">
  <title>Tender - Discover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/nav.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/discover.css">
</head>
<body>
  <nav id="app-nav"></nav>

  <main class="discover-page">

    <!-- Recipe of the Day -->
    <section id="recipeOfDay" class="recipe-of-day" style="display:none">
      <div id="rotdThumb" class="recipe-of-day-thumb"></div>
      <div>
        <div class="recipe-of-day-label">Recipe of the Day</div>
        <div id="rotdName" class="recipe-of-day-name"></div>
        <div id="rotdMeta" class="recipe-of-day-meta"></div>
      </div>
    </section>

    <!-- Page header -->
    <div class="discover-header">
      <h1>Discover Recipes</h1>
    </div>

    <!-- Search + filter controls -->
    <div class="search-bar">
      <input
        type="search"
        id="searchInput"
        placeholder="Search by name, ingredient, or description..."
        aria-label="Search recipes"
      >
      <select id="cuisineFilter" aria-label="Filter by cuisine">
        <option value="">All Cuisines</option>
      </select>
      <div class="filters-popover" id="filtersPopover">
        <button class="filters-btn" id="filtersBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span class="filters-btn-label">Filters</span>
          <span class="filters-btn-count hidden" id="filtersBtnCount">0</span>
          <svg class="filters-btn-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="2 4 6 8 10 4"/></svg>
        </button>
        <div class="filters-panel" id="filtersPanel" aria-label="Recipe filters">
          <div class="filters-panel-header">
            <div>
              <div class="filters-panel-title">Recipe Filters</div>
              <div class="filters-panel-subtitle">Pick the tags that matter most.</div>
            </div>
            <button class="filters-close-btn" id="filtersCloseBtn" type="button" aria-label="Close filters">&#x2715;</button>
          </div>
          <div class="filters-section">
            <div class="filters-section-label">Difficulty</div>
            <div class="filters-chip-grid" id="difficultyFilterChips"></div>
          </div>
          <div class="filters-section">
            <div class="filters-section-label">Dietary</div>
            <div class="filters-chip-grid filters-chip-grid--dietary" id="dietaryFilterChips"></div>
          </div>
          <div class="filters-panel-footer">
            <button class="filters-clear-btn" id="filtersClearBtn" type="button">Clear all</button>
            <button class="filters-done-btn" id="filtersDoneBtn" type="button">Done</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Fridge / ingredient filter -->
    <div class="fridge-panel" id="fridgePanel">
      <div class="fridge-header" id="fridgeToggle">
        <div class="fridge-header-left">
          <span>&#x1F9CA;</span>
          <span class="fridge-title">What's in my fridge?</span>
          <span class="fridge-count-badge" id="fridgeCountBadge" style="display:none"></span>
        </div>
        <span class="fridge-chevron">&#x25BE;</span>
      </div>
      <div class="fridge-body">
        <div class="fridge-body-inner">
          <p class="fridge-hint">Add ingredients you have — recipes are sorted by how many they use. Press Enter or comma to add multiple.</p>
          <div class="fridge-input-row">
            <input type="text" id="fridgeInput" class="fridge-input" placeholder="e.g. chicken, garlic, tomato..." autocomplete="off">
            <button id="fridgeAddBtn" class="fridge-add-btn">Add</button>
          </div>
          <div id="fridgeChips" class="fridge-chips"></div>
        </div>
      </div>
    </div>

    <!-- Recipe grid -->
    <div id="discoverGrid" class="discover-grid"></div>

  </main>

  <button class="add-recipe-fab" id="addRecipeBtn">&#x2795; Add Recipe</button>

  <script type="module" src="/src/pages/discover.js"></script>
</body>
</html>
