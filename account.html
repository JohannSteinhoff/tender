<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Tender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/nav.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/account.css">
</head>
<body>
  <nav id="app-nav"></nav>

  <main class="account-page">
    <div class="account-header">
      <div class="account-avatar-wrap">
        <div class="account-avatar" id="accountAvatar">?</div>
        <label class="avatar-upload-btn" id="avatarUploadBtn" for="photoInput">Change Photo</label>
        <input type="file" id="photoInput" accept="image/*" style="display:none">
      </div>
      <div class="account-header-info">
        <h1 id="accountName">Loading...</h1>
        <p id="accountEmail"></p>
      </div>
    </div>

    <div class="account-sections">

      <div class="account-card" id="personalCard">
        <div class="section-empty">Loading...</div>
      </div>

      <div class="pref-curl-wrapper" id="prefCurlWrapper">
        <div class="pref-easter-panel" id="prefEasterPanel"></div>
        <div class="account-card" id="preferencesCard">
          <div class="section-empty">Loading...</div>
        </div>
        <div class="pref-curl-handle" id="prefCurlHandle" title="&#x2728;"></div>
      </div>

    </div>
  </main>

  <script type="module" src="/src/pages/account.js"></script>
</body>
</html>
