<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('tender_theme'),tn=localStorage.getItem('tender_theme_name')||'default';if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark-mode');if(tn!=='default')document.documentElement.classList.add('theme-'+tn);if(tn==='code'||tn==='synthwave'||tn==='crimson')document.documentElement.classList.add('dark-mode');if(tn==='crimson')document.documentElement.dataset.crimsonFont=localStorage.getItem('tender_crimson_font')||'space';})()</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo.png">
  <title>My Account - Tender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/nav.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/account.css">
</head>
<body>
  <nav id="app-nav"></nav>

  <main class="account-page">
    <div class="account-header">
      <div class="account-avatar-wrap">
        <div class="account-avatar" id="accountAvatar">?</div>
        <label class="avatar-upload-btn" id="avatarUploadBtn" for="photoInput">Change Photo</label>
        <input type="file" id="photoInput" accept="image/*" style="display:none">
      </div>
      <div class="account-header-info">
        <h1 id="accountName">Loading...</h1>
        <p id="accountEmail"></p>
      </div>
    </div>

    <div class="account-sections">

      <div class="account-card" id="personalCard">
        <div class="section-empty">Loading...</div>
      </div>

      <div class="account-card" id="securityCard">
        <div class="section-empty">Loading...</div>
      </div>

      <div class="pref-curl-wrapper" id="prefCurlWrapper">
        <div class="pref-easter-panel" id="prefEasterPanel"></div>
        <div class="account-card" id="preferencesCard">
          <div class="section-empty">Loading...</div>
        </div>
        <div class="pref-curl-handle" id="prefCurlHandle" title="&#x2728;"></div>
      </div>

    </div>
  </main>

  <div class="modal-overlay avatar-crop-overlay hidden" id="avatarCropOverlay">
    <div class="modal avatar-crop-modal">
      <button class="modal-close" id="avatarCropClose" type="button" aria-label="Close">&times;</button>
      <div class="modal-body avatar-crop-body">
        <h2>Adjust Photo</h2>
        <div class="avatar-crop-stage" id="avatarCropStage">
          <img id="avatarCropImg" alt="" draggable="false">
        </div>
        <div class="avatar-crop-zoom-row">
          <span class="avatar-crop-zoom-icon avatar-crop-zoom-icon--sm">&#8722;</span>
          <input type="range" id="avatarCropZoom" min="0" max="100" step="0.1" value="0">
          <span class="avatar-crop-zoom-icon">+</span>
        </div>
        <div class="avatar-crop-actions">
          <button type="button" class="edit-save-btn" id="avatarCropConfirm">Save Photo</button>
          <button type="button" class="edit-cancel-btn" id="avatarCropCancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/account.js"></script>
</body>
</html>
