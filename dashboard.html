<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Tender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/nav.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/dashboard.css">
</head>
<body>
  <nav id="app-nav"></nav>

  <main class="dashboard-page">

    <!-- Welcome banner -->
    <section class="welcome-section">
      <div class="welcome-text">
        <h1 id="welcomeHeading">Welcome back!</h1>
        <p id="welcomeSub">Here's what's cooking today.</p>
      </div>
      <button class="start-swiping-btn" onclick="location.href='/swipe.html'">Start Swiping &#x1F525;</button>
    </section>

    <!-- Stats row -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="icon">&#x2764;&#xFE0F;</div>
        <h3 id="statLiked">-</h3>
        <p>Liked Recipes</p>
      </div>
      <div class="stat-card">
        <div class="icon">&#x1F37D;&#xFE0F;</div>
        <h3 id="statServings">-</h3>
        <p>Household Size</p>
      </div>
      <div class="stat-card">
        <div class="icon">&#x1F4C5;</div>
        <h3 id="statMeals">-</h3>
        <p>Meals / Week</p>
      </div>
      <div class="stat-card">
        <div class="icon">&#x1F4B0;</div>
        <h3 id="statBudget">-</h3>
        <p>Weekly Budget</p>
      </div>
    </div>

    <!-- Main grid -->
    <div class="dashboard-grid">

      <!-- Liked recipes -->
      <div class="section-card">
        <div class="section-header">
          <h2>&#x2764;&#xFE0F; Liked Recipes</h2>
          <a href="/discover.html">View all</a>
        </div>
        <div id="likedRecipesGrid" class="recipes-mini-grid">
          <div class="section-empty"><div class="empty-icon">&#x1F37D;&#xFE0F;</div>No liked recipes yet. Start swiping!</div>
        </div>
      </div>

      <!-- Profile info -->
      <div class="section-card profile-section">
        <div class="section-header">
          <h2>&#x1F464; Your Profile</h2>
        </div>
        <div id="profileInfo" class="profile-info">
          <div class="section-empty"><div class="empty-icon">&#x23F3;</div>Loading...</div>
        </div>
      </div>

    </div>

  </main>

  <script type="module" src="/src/pages/dashboard.js"></script>
</body>
</html>
