<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender - Swipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/nav.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/swipe.css">
</head>
<body class="swipe-page-body">
  <nav id="app-nav"></nav>

  <div id="swipePage" class="swipe-page">
    <div id="swipeBg" class="swipe-bg"></div>
    <div id="emojiRainContainer" class="emoji-rain-container"></div>

    <!-- Difficulty filter sidebar -->
    <aside class="swipe-sidebar">
      <h3>Difficulty</h3>
      <div class="swipe-diff-btns">
        <button class="swipe-diff-btn active" data-diff="">All</button>
        <button class="swipe-diff-btn" data-diff="easy">Easy</button>
        <button class="swipe-diff-btn" data-diff="medium">Medium</button>
        <button class="swipe-diff-btn" data-diff="hard">Hard</button>
      </div>
      <p id="swipeCounter" class="swipe-counter">0 recipes liked</p>
    </aside>

    <!-- Card stack -->
    <div class="swipe-main">
      <div id="swipeContainer" class="swipe-container"></div>

      <!-- Action buttons -->
      <div id="swipeActions" class="swipe-actions" style="display:none">
        <div class="swipe-btn-wrap">
          <button class="swipe-action-btn swipe-btn-nope" id="btnNope" aria-label="Nope">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <span class="btn-label">Nope</span>
          <span class="btn-key">&#x2190;</span>
        </div>
        <div class="swipe-btn-wrap swipe-btn-wrap-sm">
          <button class="swipe-action-btn swipe-btn-info" id="btnInfo" aria-label="Details">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/>
            </svg>
          </button>
          <span class="btn-label">Info</span>
          <span class="btn-key">Space</span>
        </div>
        <div class="swipe-btn-wrap">
          <button class="swipe-action-btn swipe-btn-like" id="btnLike" aria-label="Like">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
          <span class="btn-label">Like</span>
          <span class="btn-key">&#x2192;</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/swipe.js"></script>
</body>
</html>
