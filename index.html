<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tender</title>
    <style>
      body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; background: linear-gradient(135deg, #FFF5F5 0%, #FFF9EC 50%, #F0FFF4 100%); }
    </style>
  </head>
  <body>
    <p>Loading...</p>
    <script type="module">
      import { auth } from '/src/firebase.js';
      import { onAuthStateChanged } from 'firebase/auth';

      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.replace('/dashboard.html');
        } else {
          window.location.replace('/login.html');
        }
      });
    </script>
  </body>
</html>
